name: Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

# Пуш в main (и тег / ручной запуск) пересобирает мод и обновляет
# GitHub Release для текущей mod_version: jar NeoForge и Fabric плюс зависимости.
# Новый номер версии в gradle.properties → новый релиз vX.Y.Z.
# SHA-256 у каждого файла считает сам GitHub при загрузке.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read versions from gradle.properties
        id: versions
        run: |
          set -euo pipefail
          mod_version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          kff_version="$(grep -E '^kff_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          patchouli_version="$(grep -E '^patchouli_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          patchouli_fabric_version="$(grep -E '^patchouli_fabric_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          fabric_api_version="$(grep -E '^fabric_api_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          fabric_kotlin_version="$(grep -E '^fabric_kotlin_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          cloth_config_modrinth_version="$(grep -E '^cloth_config_modrinth_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          modmenu_version="$(grep -E '^modmenu_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          placeholder_api_version="$(grep -E '^placeholder_api_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          echo "mod_version=${mod_version}" >> "$GITHUB_OUTPUT"
          echo "kff_version=${kff_version}" >> "$GITHUB_OUTPUT"
          echo "patchouli_version=${patchouli_version}" >> "$GITHUB_OUTPUT"
          echo "patchouli_fabric_version=${patchouli_fabric_version}" >> "$GITHUB_OUTPUT"
          echo "fabric_api_version=${fabric_api_version}" >> "$GITHUB_OUTPUT"
          echo "fabric_kotlin_version=${fabric_kotlin_version}" >> "$GITHUB_OUTPUT"
          echo "cloth_config_modrinth_version=${cloth_config_modrinth_version}" >> "$GITHUB_OUTPUT"
          echo "modmenu_version=${modmenu_version}" >> "$GITHUB_OUTPUT"
          echo "placeholder_api_version=${placeholder_api_version}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${mod_version}" >> "$GITHUB_ENV"

      - name: Check tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          expected="v${{ steps.versions.outputs.mod_version }}"
          actual="${GITHUB_REF_NAME}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Tag ${actual} must be ${expected} (mod_version in gradle.properties)."
            exit 1
          fi

      - name: Point version tag at this commit
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          tag="v${{ steps.versions.outputs.mod_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${tag}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${tag}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build and test
        run: gradle build --stacktrace

      - name: Collect release jars
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          jars=(build/libs/patchoulibutton-*.jar)
          if [[ ${#jars[@]} -eq 0 ]]; then
            echo "No patchoulibutton jar in build/libs"
            exit 1
          fi
          for jar in "${jars[@]}"; do
            case "${jar}" in
              *-sources.jar|*-javadoc.jar) continue ;;
              *) cp -v "${jar}" release-assets/ ;;
            esac
          done
          test -f "release-assets/patchoulibutton-neoforge-1.21.1-${{ steps.versions.outputs.mod_version }}.jar"
          fabric_jars=(fabric/build/libs/patchoulibutton-fabric-*.jar)
          if [[ ${#fabric_jars[@]} -eq 0 ]]; then
            echo "No Fabric jar in fabric/build/libs"
            exit 1
          fi
          for jar in "${fabric_jars[@]}"; do
            case "${jar}" in
              *-sources.jar|*-dev.jar) continue ;;
              *) cp -v "${jar}" release-assets/ ;;
            esac
          done
          test -f "release-assets/patchoulibutton-fabric-1.21.1-${{ steps.versions.outputs.mod_version }}.jar"
          chmod +x .github/scripts/fetch-companion-jars.sh
          .github/scripts/fetch-companion-jars.sh \
            release-assets \
            "${{ steps.versions.outputs.kff_version }}" \
            "${{ steps.versions.outputs.patchouli_version }}" \
            "${{ steps.versions.outputs.fabric_api_version }}" \
            "${{ steps.versions.outputs.fabric_kotlin_version }}" \
            "${{ steps.versions.outputs.patchouli_fabric_version }}" \
            "${{ steps.versions.outputs.cloth_config_modrinth_version }}" \
            "${{ steps.versions.outputs.modmenu_version }}" \
            "${{ steps.versions.outputs.placeholder_api_version }}"
          find release-assets -name 'kotlinforforge-*.jar' | grep -q .
          find release-assets -name 'Patchouli-*-NEOFORGE.jar' | grep -q .
          find release-assets -name 'Patchouli-*-FABRIC.jar' | grep -q .
          find release-assets -name 'fabric-api-*.jar' | grep -q .
          find release-assets -name 'fabric-language-kotlin-*.jar' | grep -q .
          find release-assets -name 'cloth-config-*.jar' | grep -q .
          ls -lh release-assets

      # overwrite_files заменяет только файлы с тем же именем.
      - name: Remove stale GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ steps.versions.outputs.mod_version }}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            echo "No existing release ${tag}"
            exit 0
          fi
          mapfile -t existing < <(gh release view "${tag}" --json assets --jq '.assets[].name')
          for name in "${existing[@]}"; do
            if [[ ! -f "release-assets/${name}" ]]; then
              echo "Deleting stale asset ${name}"
              gh release delete-asset "${tag}" "${name}" --yes
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versions.outputs.mod_version }}
          name: Patchouli Button ${{ steps.versions.outputs.mod_version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/patchoulibutton-*.jar
            release-assets/kotlinforforge-*.jar
            release-assets/Patchouli-*.jar
            release-assets/fabric-api-*.jar
            release-assets/fabric-language-kotlin-*.jar
            release-assets/cloth-config-*.jar
            release-assets/modmenu-*.jar
            release-assets/placeholder-api-*.jar
          body: |
            Minecraft **1.21.1**. Install either the NeoForge set or the Fabric set, not both.

            ### NeoForge

            | File | Required | Source |
            | --- | --- | --- |
            | `patchoulibutton-neoforge-1.21.1-${{ steps.versions.outputs.mod_version }}.jar` | Yes | this mod |
            | `kotlinforforge-${{ steps.versions.outputs.kff_version }}-all.jar` | Yes | [Kotlin for Forge](https://modrinth.com/mod/kotlin-for-forge) (LGPL-2.1) |
            | `Patchouli-*-NEOFORGE.jar` | Yes | [Patchouli](https://modrinth.com/mod/patchouli) (CC-BY-NC-SA-3.0) |

            ### Fabric

            | File | Required | Source |
            | --- | --- | --- |
            | `patchoulibutton-fabric-1.21.1-${{ steps.versions.outputs.mod_version }}.jar` | Yes | this mod |
            | `fabric-api-*.jar` | Yes | [Fabric API](https://modrinth.com/mod/fabric-api) (Apache-2.0) |
            | `fabric-language-kotlin-*.jar` | Yes | [Fabric Language Kotlin](https://modrinth.com/mod/fabric-language-kotlin) (Apache-2.0) |
            | `Patchouli-*-FABRIC.jar` | Yes | [Patchouli](https://modrinth.com/mod/patchouli) (CC-BY-NC-SA-3.0) |
            | `cloth-config-*.jar` | Yes, for the config screen | [Cloth Config](https://modrinth.com/mod/cloth-config) (LGPL-3.0) |
            | `modmenu-*.jar` | No, opens the config screen | [Mod Menu](https://modrinth.com/mod/modmenu) (MIT) |
            | `placeholder-api-*.jar` | No, required by Mod Menu | [Text Placeholder API](https://modrinth.com/mod/placeholder-api) (LGPL-3.0) |

            Do not install `*-sources.jar`. Companion jars are official Modrinth builds, rehosted here for a one-page install. Patchouli is redistributed for non-commercial use with attribution to VazkiiMods. A line that says "requires fabric 0.100.3" means the Fabric API jar, not Fabric Loader. GitHub shows a SHA-256 digest next to each uploaded file.

      - name: Check Modrinth token
        id: modrinth_token
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "MODRINTH_TOKEN is empty. Modrinth publish will be skipped."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Replace Modrinth versions
        if: steps.modrinth_token.outputs.present == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/replace-modrinth-versions.py \
            patchouli-button-neoforge-port \
            "${{ steps.versions.outputs.mod_version }}" \
            "${{ steps.versions.outputs.mod_version }}-fabric"

      - name: Publish Modrinth
        if: steps.modrinth_token.outputs.present == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: patchouli-button-neoforge-port
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: ${{ steps.versions.outputs.mod_version }}
          version: ${{ steps.versions.outputs.mod_version }}
          version-type: release
          changelog: |
            Minecraft 1.21.1 / NeoForge. Patchouli Button ${{ steps.versions.outputs.mod_version }}.
          loaders: |
            neoforge
          game-versions: |
            1.21.1
          java: |
            21
          files: release-assets/patchoulibutton-neoforge-1.21.1-${{ steps.versions.outputs.mod_version }}.jar
          dependencies: |
            kotlin-for-forge(required){modrinth:ordsPcFz}
            patchouli(required){modrinth:nU0bVIaL}

      - name: Publish Modrinth Fabric
        if: steps.modrinth_token.outputs.present == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: patchouli-button-neoforge-port
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false
          name: ${{ steps.versions.outputs.mod_version }} Fabric
          version: ${{ steps.versions.outputs.mod_version }}-fabric
          version-type: release
          changelog: |
            Minecraft 1.21.1 / Fabric. Patchouli Button ${{ steps.versions.outputs.mod_version }}.
          loaders: |
            fabric
          game-versions: |
            1.21.1
          java: |
            21
          files: release-assets/patchoulibutton-fabric-1.21.1-${{ steps.versions.outputs.mod_version }}.jar
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
            fabric-language-kotlin(required){modrinth:Ha28R6CL}
            patchouli(required){modrinth:nU0bVIaL}
            cloth-config(required){modrinth:9s6osm5g}
            modmenu(optional){modrinth:mOgUt4GM}
            placeholder-api(optional){modrinth:eXts2L7r}

      - name: Delete replaced Modrinth versions
        if: steps.modrinth_token.outputs.present == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/replace-modrinth-versions.py --finish release-assets/modrinth-delete-after-publish.txt

      - name: Update Modrinth description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "MODRINTH_TOKEN is empty. The Modrinth page will not be updated."
            exit 0
          fi
          python3 .github/scripts/update-modrinth-body.py patchouli-button-neoforge-port modrinth.md

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish jars to McnCDN
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          MCNS_WORKER_ID: ${{ secrets.MCNS_WORKER_ID }}
          MCNS_WORKER_KEY: ${{ secrets.MCNS_WORKER_KEY }}
          MCNS_MOD_VERSION: ${{ steps.versions.outputs.mod_version }}
          MCNS_COMMIT: ${{ github.sha }}
          MCNS_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          one() {
            local pattern="$1"
            shopt -s nullglob
            local matches=( $pattern )
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "Expected exactly one file for ${pattern}, found ${#matches[@]}: ${matches[*]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }
          mod_jar="$(one 'release-assets/patchoulibutton-neoforge-1.21.1-*.jar')"
          kff_jar="$(one 'release-assets/kotlinforforge-*.jar')"
          patchouli_jar="$(one 'release-assets/Patchouli-*-NEOFORGE.jar')"
          node scripts/mcns-release.mjs patchouli-button-rework-mod auto \
            "mod=${mod_jar}" \
            "kotlinforforge=${kff_jar}" \
            "patchouli=${patchouli_jar}"
