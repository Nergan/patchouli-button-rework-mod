# ============================================================
# Настройки Gradle
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# ============================================================
# Parchment-маппинги
# ============================================================
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ============================================================
# Minecraft / NeoForge
# ============================================================
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.209
loader_version_range=[1,)

# ============================================================
# Kotlin for Forge — https://modrinth.com/mod/kotlin-for-forge
# ============================================================
kotlin_version=2.1.20
kff_version=5.8.0
kff_version_range=[5.8,)

# Игровая сборка Patchouli на Modrinth (NeoForge 1.21.1), кладётся в GitHub Release.
patchouli_version=1.21.1-93-neoforge
patchouli_version_range=[1.21.1-93-neoforge,)
patchouli_fabric_version=1.21.1-93-fabric
fabric_loader_version=0.16.14
fabric_api_version=0.116.17+1.21.1
fabric_kotlin_version=1.13.2+kotlin.2.1.20
cloth_config_version=15.0.140
# На Modrinth у этого файла version_number с суффиксом +fabric.
cloth_config_modrinth_version=15.0.140+fabric
modmenu_version=11.0.4
placeholder_api_version=2.4.2+1.21

# ============================================================
# Метаданные мода
# ============================================================
mod_id=patchoulibutton
mod_name=Patchouli Button Rework
mod_license=MPL-2.0
mod_version=1.0.0
mod_group_id=com.patchoulibutton.mod
mod_authors=Globox_Z, Patchouli Button contributors
mod_description=[Every mod guide gathered into one book](https://github.com/Nergan/patchouli-button-neoforge-port-mod).
